# Кожна перевірка є окремим кроком робочого процесу, щоб у журналі запуску було видно,
# яка саме не пройшла. Перелік і порядок визначає pipeline.config.mjs. Дії закріплено за
# повним SHA коміту, токен має лише право читання вмісту (GitHub Docs, «Secure use reference»).
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      budget_script_bytes:
        description: "Межа обсягу JavaScript для budget, байтів (1000 дає червоний запуск)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      BUDGET_SCRIPT_BYTES: ${{ github.event.inputs.budget_script_bytes || '' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/pipeline.mjs --step=signatures
      - run: node tools/pipeline.mjs --step=deps-audit
      - run: node tools/pipeline.mjs --step=lifecycle
      - run: node tools/pipeline.mjs --step=typecheck
      - run: node tools/pipeline.mjs --step=lint
      - run: node tools/pipeline.mjs --step=test
      - run: node tools/pipeline.mjs --step=build
      - run: node tools/pipeline.mjs --step=e2e
      - run: node tools/pipeline.mjs --step=budget
      - run: node tools/pipeline.mjs --step=sbom
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: check-reports
          path: check-reports/
          if-no-files-found: warn
